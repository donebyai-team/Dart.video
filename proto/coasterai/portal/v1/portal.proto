syntax = "proto3";

package coasterai.portal.v1;

option go_package = "github.com/shank318/coasterai/pb/coasterai/portal/v1;pbportal";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "coasterai/core/v1/core.proto";
import "coasterai/core/v1/slide.proto";
import "coasterai/core/v1/video.proto";
import "coasterai/core/v1/brandkit.proto";
import "coasterai/core/v1/template.proto";
import "coasterai/core/v1/figma.proto";
import "coasterai/core/v1/media_asset.proto";
import "coasterai/core/v1/chat.proto";
import "coasterai/portal/v1/templates.proto";
import "coasterai/portal/v1/voiceover.proto";
import "coasterai/core/v1/audio.proto";
import "coasterai/core/v1/credits.proto";

service PortalService {
  rpc GetConfig(.google.protobuf.Empty) returns (Config);
  rpc Self(.google.protobuf.Empty) returns (User);
//  rpc AddUser(AddUserRequest) returns (User);
//  rpc RenewUser(RenewUserRequest) returns (.google.protobuf.Empty);
  rpc GetIntegration(GetIntegrationRequest) returns (Integrations);
  rpc RevokeIntegration(RevokeIntegrationRequest) returns (.google.protobuf.Empty);
  rpc UpdateIntegration(UpdateIntegrationRequest) returns (.google.protobuf.Empty);
  rpc PasswordlessStart(PasswordlessStartRequest) returns (.google.protobuf.Empty);
  rpc PasswordlessVerify(PasswordlessStartVerify) returns (JWT);
  rpc OauthAuthorize(OauthAuthorizeRequest) returns (OauthAuthorizeResponse);
  rpc OauthCallback(OauthCallbackRequest) returns (OauthCallbackResponse);
  rpc SocialLoginCallback(OauthCallbackRequest) returns (JWT);
  rpc GetIntegrations(.google.protobuf.Empty) returns (Integrations);
  rpc CreateVideo(CreateVideoRequest) returns (stream CreateVideoResponse);
  rpc ContinueVideoPlanning(ContinueVideoPlanningRequest) returns (stream CreateVideoResponse);
  rpc GetVideo(GetVideoRequest) returns (stream GetVideoResponse);
  rpc StopVideo(StopVideoRequest) returns (.google.protobuf.Empty);
  rpc GetVideos(.google.protobuf.Empty) returns (GetVideosResponse);

  rpc DeleteVideo(VideoRequestWithID) returns (.google.protobuf.Empty);
  rpc DuplicateVideo(VideoRequestWithID) returns (GetVideoResponse);
  rpc RenderVideo(VideoRequestWithID) returns (RenderVideoResponse);

  rpc UpdateVideoConfig(UpdateVideoConfigRequest) returns (UpdateVideoConfigResponse);

  rpc ListFigmaFrames(ListFigmaFramesRequest) returns (ListFigmaFramesResponse);
  rpc ImportFigmaFrame(ImportFigmaFrameRequest) returns (ImportFigmaFrameResponse);

  // brand identity request
  rpc CreateBrandIdentity(BrandIdentityRequest) returns (core.v1.BrandIdentity);
  rpc GetBrandIdentities(.google.protobuf.Empty) returns (BrandIdentityResponse);
  rpc UpdateBrandIdentity(UpdateBrandIdentityRequest) returns (.google.protobuf.Empty);

  // Edit animations
  rpc GenerateOrEditScene(GenerateOrEditSceneRequest) returns (stream GenerateOrEditSceneResponse);
  rpc GetConversationHistory(ConversationHistoryRequest) returns (GetConversationHistoryResponse);

  // Assets
  rpc UpdateCode(UpdateCodeRequest) returns (core.v1.CodeRegistry);
  rpc GetMediaAssets(GetMediaAssetsRequest) returns (GetMediaAssetsResponse);
  rpc GetMediaAssetsByID(GetMediaAssetsByIDs) returns (GetMediaAssetsResponse);
  rpc GenerateMusic(VideoRequestWithID) returns (GetMediaAssetsResponse);

  // Templates
  rpc CreateTemplate(.google.protobuf.Empty) returns (core.v1.AnimationTemplate);
  rpc GetTemplate(portal.v1.GetTemplateRequest) returns (core.v1.AnimationTemplate);
  rpc GetTemplates(portal.v1.GetTemplatesRequest) returns (portal.v1.GetTemplatesResponse);
  rpc SaveTemplate(portal.v1.UpdateTemplateRequest) returns (.google.protobuf.Empty);
  rpc DeleteTemplate(GetTemplateRequest) returns (.google.protobuf.Empty);

  // AI Suggestions
  rpc GenerateSuggestions(portal.v1.GenerateSuggestionsInput) returns (portal.v1.GenerateSuggestionsResponse);
  rpc RenderSuggestion(portal.v1.RenderSuggestionsInput) returns (SuggestScenesResponse);

  // Voiceover
  rpc GenerateVoiceover(GenerateVoiceoverRequest) returns (core.v1.Voiceover);

  // Credits
  rpc GetCredits(core.v1.GetCreditsRequest) returns (core.v1.GetCreditsResponse);
}

message GetMediaAssetsByIDs {
  repeated string assetsIDs = 1;
}

message GetMediaAssetsRequest {
  core.v1.MediaType mediaType = 1;
}

message GetMediaAssetsResponse {
  repeated core.v1.MediaAsset assets = 1;
}

message UpdateCodeRequest {
  string slideId = 1;
  string code = 2;
}

message GenerateOrEditSceneRequest {
  string videoId = 1;
  core.v1.Slide slideToEdit = 2;
  oneof input {
    CreateVideoRequest request = 3;
    ContinueVideoPlanningRequest ask_user_input = 4;
  }
  int64 version = 5;
}

message ConversationHistoryRequest {
  string videoId = 1;
  string slideId = 2;
  optional bool all = 3;
  optional string checkpoint = 4;
  int64 videoVersion = 5;
}

message GetConversationHistoryResponse {
  repeated core.v1.ConversationMessage messages = 1;
}

message GenerateOrEditSceneResponse {
  core.v1.Slide slide = 1;
  string thinking_summary = 2;
  AskUserQuestion ask_user_question = 3;
  bool waiting_for_user_input = 4;
  bool completed = 6;
  string error_message = 7;
}

message SuggestScenesRequest {
  string videoId = 1;
  string sceneId = 2;
  core.v1.AnimationCategory category = 3;
}

message SuggestScenesResponse {
  repeated core.v1.Section groups = 1; // We call Section as a group of slides
}

message UpdateBrandIdentityRequest {
  core.v1.BrandIdentity identity = 1;
}

message BrandIdentityRequest {
  string websiteUrl = 1;
}

message BrandIdentityResponse {
  repeated core.v1.BrandIdentity identities = 1;
  repeated string supportedFonts = 2;
}

message RenderVideoResponse {
  string jobId = 1;
  string videoId = 2;
  int64 version = 3;
}

message ListFigmaFramesRequest {
  string file_key = 1;
  string file_url = 2;
  optional string query = 3;
  optional string page_id = 4;
}

message ListFigmaFramesResponse {
  string file_key = 1;
  string file_name = 2;
  repeated core.v1.FigmaFrame frames = 3;
  repeated core.v1.FigmaPage pages = 4;
}

message ImportFigmaFrameRequest {
  string file_key = 1;
  string node_id = 2;
}

message ImportFigmaFrameResponse {
  core.v1.MediaAsset asset = 1;
  core.v1.FigmaFrame frame = 2;
}

message StopVideoRequest {
  string video_id = 1;
}

message VideoRequestWithID {
  string video_id = 1;
}

message GetVideoResponse {
  core.v1.Video video = 1;
  string thinking_summary = 2;
  int32 total_slides = 3;
}

message UpdateVideoConfigRequest {
  string id = 1;
  core.v1.VideoConfig config = 2;
  core.v1.VideoMetadata metadata = 4;
  string name = 5;
  int64 version = 7;
}

message UpdateVideoConfigResponse {
  int64 version = 1;
}

message GetVideoRequest {
  string id = 1;
}

message GetVideosResponse {
  repeated core.v1.Video videos = 1;
}

message CreateVideoRequest {
  string prompt = 2;
  core.v1.Resolution resolution = 3;
  int32 durationInSec = 4;
  optional string brand_library_id = 5;
  core.v1.VideoLanguage language = 6;
  core.v1.StyleType styleType = 7;
  int32 fps = 8;
  repeated core.v1.SelectedMediaAsset assets = 9;
  map<string, string> questions = 10;
  repeated core.v1.SelectedMediaAsset references = 11;
  optional core.v1.AIModel aiModel = 12;
}

message CreateVideoResponse {
  string id = 1;
  string thinking_summary = 2;
  repeated AskUserQuestion ask_user_question = 3;
  bool waiting_for_user_input = 4;
  bool planning_completed = 5;
  string error_message = 6;
}

message ContinueVideoPlanningRequest {
  string id = 1; // video id
  string response = 2;
  repeated core.v1.SelectedMediaAsset assets = 3;
  optional string slide_id = 4;
  optional core.v1.Script script = 5;
}

message AskUserQuestion {
  string tool_name = 1;
  string question_text = 2;
  repeated string options = 3;
  optional bool allow_custom_entry = 4;
  optional core.v1.MediaAsset asset = 5;
  AskUserQuestionType questionType = 6;
  optional core.v1.Script script= 7;
}

enum AskUserQuestionType {
  ASK_USER_QUESTION_TYPE_UNDEFINED = 0;
  ASK_USER_QUESTION_TYPE_GENERAL = 1;
  ASK_USER_QUESTION_TYPE_ASSET_CLARIFICATION = 2;
  ASK_USER_QUESTION_TYPE_UPLOAD_ASSET = 3;
  ASK_USER_QUESTION_TYPE_SCRIPT = 4;
}

message Config {
  string auth0_domain = 1;
  string auth0_client_id = 2;
  string auth0_scope = 3;
  string msoft_auth0_callback_url = 4;
  string full_story_org_id = 5;
  string google_auth0_callback_url = 6;
}

message PasswordlessStartRequest {
  string redirect_uri = 1;
  string email = 2;
}

message PasswordlessStartVerify {
  string email = 1;
  string code = 2;
}

message AuthStateRequest { string redirect_uri = 1; }

message State {
  string state = 1;
  string nonce = 2;
}

message User {
  string id = 1;
  string email = 2;
  bool email_verified = 3;
  UserRole role = 4;
  repeated Organization organizations = 7;
  .google.protobuf.Timestamp created_at = 10;
  bool is_onboarding_done = 12;
}

message OauthAuthorizeRequest {
  IntegrationType integration_type = 1;
  string redirect_url = 2;
}

enum OauthAuthorizeType {
  OAUTH_AUTHORIZE_TYPE_UNSPECIFIED = 0;
  OAUTH_AUTHORIZE_TYPE_INTEGRATION = 1;
}

message OauthAuthorizeResponse { string authorize_url = 1; }

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
  USER_ROLE_PLATFORM_ADMIN = 3;
}

message IssueRequest {
  string code = 1;
  string state = 2;
}

message JWT {
  string token = 1;
  int64 expires_at = 2;
}

message Organization {
  string id = 1;
  string name = 2;
  OrganizationFeatureFlags feature_flags = 3;
  .google.protobuf.Timestamp created_at = 4;
}

message OrganizationFeatureFlags {
  string demoVideoId = 1;
}

message Integration {
  string id = 1;
  string organization_id = 2;
  IntegrationType type = 3;
  IntegrationState status = 4;
  oneof details {
    RedditIntegration reddit = 6;
    FigmaIntegration figma = 7;
  }
}

message RedditIntegration {
  string user_name = 1;
  string reason = 2;
  string alpha2_country_code =3;
}

message FigmaIntegration {
  string user_id = 1;
  string handle = 2;
  string email = 3;
}

message Integrations {
  repeated Integration integrations = 1;
}

message UpdateIntegrationRequest {
  string id =1;
  oneof details {
    RedditIntegration reddit = 6;
  }
}

message RevokeIntegrationRequest {
  string id =1;
}

message GetIntegrationRequest { IntegrationType type = 1; }

enum IntegrationType {
  INTEGRATION_TYPE_UNSPECIFIED = 0;
  INTEGRATION_TYPE_MICROSOFT = 1;
  INTEGRATION_TYPE_GOOGLE = 2;
  INTEGRATION_TYPE_REDDIT = 3;
  INTEGRATION_TYPE_REDDIT_DM_LOGIN = 4;
  INTEGRATION_TYPE_FIGMA = 5;
}

enum IntegrationState {
  INTEGRATION_STATE_UNSPECIFIED = 0;
  INTEGRATION_STATE_ACTIVE = 1;

  // This is a transient state not stored in the actual integration model. This will
  // be that case when for multiple reasons, the token we had for this integration is
  // revoked.
  INTEGRATION_STATE_AUTH_REVOKED = 2;
  INTEGRATION_STATE_ACCOUNT_SUSPENDED = 3;
  INTEGRATION_STATE_AUTH_EXPIRED = 4;
  INTEGRATION_STATE_NOT_ESTABLISHED = 5;
}

message OauthCallbackRequest {
  string state = 1;
  optional string external_code = 2;
}

message OauthCallbackResponse { string redirect_url = 1; }
