syntax = "proto3";

package coasterai.core.v1;
option go_package = "github.com/shank318/coasterai/pb/coasterai/core/v1;pbcore";
import "google/protobuf/timestamp.proto";
import "coasterai/core/v1/slide.proto";
import "coasterai/core/v1/video.proto";
import "google/protobuf/struct.proto";

message AnimationTemplate {
  string id = 1;
  string name = 2;
  repeated string categories = 3;
  string description = 4;
  repeated google.protobuf.Struct schema = 5;
  VideoConfig config = 6;
  VideoMetadata metadata = 7;
  .google.protobuf.Timestamp created_at = 8;
  string status = 9;
  int64 version = 10;
}

enum AnimationCategory {
  ANIMATION_CATEGORY_UNSPECIFIED = 0;
  ANIMATION_CATEGORY_TEXT = 1;
  ANIMATION_CATEGORY_INTRO = 2;
  ANIMATION_CATEGORY_VISUALS = 3;
  ANIMATION_CATEGORY_MEDIA = 4;
  ANIMATION_CATEGORY_SOCIAL = 5;
  ANIMATION_CATEGORY_CTA = 6;
}