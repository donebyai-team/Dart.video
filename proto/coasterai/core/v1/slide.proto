syntax = "proto3";

package coasterai.core.v1;
option go_package = "github.com/shank318/coasterai/pb/coasterai/core/v1;pbcore";
import "google/protobuf/struct.proto";

// ===================== ENUMS =====================

enum SlideType {
  SLIDE_TYPE_UNDEFINED = 0;
  SLIDE_TYPE_TEXT_ANIMATION = 1;
  SLIDE_TYPE_INFOGRAPHIC = 2;
  SLIDE_TYPE_VISUAL_ANIMATION = 3;
  SLIDE_TYPE_STACK = 4;
  SLIDE_TYPE_MEDIA = 5;
}

enum MediaType {
  MEDIA_TYPE_UNDEFINED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
}

enum StackAnimationMode {
  STACK_ANIMATION_MODE_STACK = 0;
  STACK_ANIMATION_MODE_REVEAL = 1;
}

enum TransitionType {
  TRANSITION_NONE = 0;
  TRANSITION_FADE = 1;
  TRANSITION_SLIDE_LEFT = 2;
  TRANSITION_SLIDE_RIGHT = 3;
  TRANSITION_SLIDE_UP = 4;
}

// ===================== CORE MESSAGES =====================

message MediaSlideStyle {
  float borderRadius = 1;
  optional string objectFit = 2;
}

message MediaSlideContent {
  MetaData meta = 1;
  string src = 2;
  MediaSlideStyle style = 3;
  MediaType mediaType = 4;
  optional UploadedMedia uploadedMedia = 5;
}

message MetaData {
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  optional float scale = 6;
  optional float rotation = 7;
}
message AnimationSlideContent {
  string templateId = 1;
  google.protobuf.Struct templateConfig = 2;
  MetaData meta = 3;
  string templateUrl = 4;
}

message StackSlideContent {
  StackAnimationMode animationMode = 1;
  repeated Slide items = 2;
}

message UploadedMedia {
  string url = 1;
  string thumbnailUrl = 2;
  float width = 3;
  float height =4;
  string mimeType = 5;
  optional float duration = 6;
  float size = 7;
  string fileId = 8;
  string fileName = 9;
}

// ===================== EFFECTS =====================

message SpotlightEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float blurAmount = 6;
  float borderRadius = 7;
  float startTime = 8;
  float endTime = 9;
}

message CalloutEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float blurAmount = 6;
  float borderRadius = 7;
  float startTime = 8;
  float endTime = 9;
  string color = 10;
}

message ZoomEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float zoomLevel = 4;
  float startTime = 5;
  float endTime = 6;
}

// ===================== BACKWARD COMPAT TYPES =====================

enum EffectType {
  EFFECT_TYPE_UNDEFINED = 0;
  EFFECT_TYPE_CALLOUT = 1;
  EFFECT_TYPE_SPOTLIGHT = 2;
  EFFECT_TYPE_ZOOM = 3;
}

// ===================== SLIDE =====================

message Slide {
  string id = 1;
  SlideType type = 2;
  string transcript = 3;
  float duration = 4;

  TransitionType transition = 5;
  optional float transitionDuration = 6;
  optional BackgroundStyle background_style = 7;

  oneof content {
    MediaSlideContent media = 8;
    AnimationSlideContent animation = 9;
    StackSlideContent stack = 10;
  }

  optional bool voiceoverGenerated = 15;
  optional bool isNested = 16;
  repeated Slide subSlides = 17;
  repeated SpotlightEffect spotlights = 18;
  repeated CalloutEffect callouts = 19;
  repeated ZoomEffect zooms = 20;
}

message BackgroundStyle {
  oneof style {
    SolidColor solid = 1;
    Gradient gradient = 2;
    BackgroundImage image = 3;
  }

  bool apply_all = 4;
}

message SolidColor {
  string hex = 1; // Example: "#0f172a"
}

message BackgroundImage {
  string url = 1; // CDN or storage URL
}

message Gradient {
  GradientType type = 1;
  int32 angle = 2; // 0–360 degrees

  repeated GradientStop stops = 3;
}

message GradientStop {
  string color = 1;   // "#ffffff"
  int32 position = 2; // 0–100 (%)
}

enum GradientType {
  GRADIENT_TYPE_LINEAR = 0;
  GRADIENT_TYPE_RADIAL = 1;
}



// ===================== SECTION =====================

message Section {
  string id = 1;
  string title = 2;
  string color = 3;
  repeated Slide slides = 4;
  optional bool voiceoverGenerated = 5;
}
