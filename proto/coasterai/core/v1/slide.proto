syntax = "proto3";

package coasterai.core.v1;
option go_package = "github.com/shank318/coasterai/pb/coasterai/core/v1;pbcore";
import "google/protobuf/struct.proto";

// ===================== ENUMS =====================

enum SlideStatus {
  SLIDE_STATUS_UNDEFINED = 0;
  SLIDE_STATUS_GENERATED = 1;
  SLIDE_STATUS_PENDING = 2;
}

enum StackAnimationMode {
  STACK_ANIMATION_MODE_STACK = 0;
  STACK_ANIMATION_MODE_REVEAL = 1;
}

enum TransitionType {
  TRANSITION_NONE = 0;
  TRANSITION_FADE = 1;

  TRANSITION_SLIDE_LEFT = 2;
  TRANSITION_SLIDE_RIGHT = 3;
  TRANSITION_SLIDE_UP = 4;
  TRANSITION_SLIDE_DOWN = 5;

  TRANSITION_WIPE_LEFT = 6;
  TRANSITION_WIPE_RIGHT = 7;
  TRANSITION_WIPE_UP = 8;
  TRANSITION_WIPE_DOWN = 9;

  TRANSITION_FLIP_HORIZONTAL = 10;
  TRANSITION_FLIP_VERTICAL = 11;

  TRANSITION_CLOCK_WIPE = 12;
  TRANSITION_FLIP_LEFT = 13;
  TRANSITION_FLIP_RIGHT = 14;
  TRANSITION_FLIP_UP = 15;
  TRANSITION_FLIP_DOWN = 16;
  TRANSITION_IRIS = 17;
  TRANSITION_STRIPPED_SLAM = 18;
}

enum TransitionDirection {
  TRANSITION_DIRECTION_UNSPECIFIED = 0;
  TRANSITION_DIRECTION_FROM_LEFT = 1;
  TRANSITION_DIRECTION_FROM_RIGHT = 2;
  TRANSITION_DIRECTION_FROM_TOP = 3;
  TRANSITION_DIRECTION_FROM_BOTTOM = 4;
}

// ===================== CORE MESSAGES =====================

// Mostly be used for debugging what AI created
// Useful for rerunning the generation
// selectedTemplateDescription is basically the prompt generated to created the animation
// in case of existing template selectedTemplateDescription = template description
message AnimationSlidePlan {
  int64 index = 1;
  string beatDescription = 2;
  string animationType = 3;
  string categorySearcQquery = 4;
  int64 durationInFrames = 5;
  optional string voiceover = 6;
  optional string selectedTemplateDescription = 7;
  optional string thinking_summary = 8;
}

message MetaData {
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  optional float scale = 6;
  optional float rotation = 7;
}
message AnimationSlideContent {
  CodeRegistry codeRegistry = 1;
  AnimationSlidePlan plan = 2;
  google.protobuf.Struct edits = 3;
  repeated CodeRegistry history = 4;
}

message CodeRegistry {
  string mUrl = 1;
  string tUrl = 2;
  string code = 3;
  optional google.protobuf.Struct edits = 4; // only used to keep it as history
  optional google.protobuf.Struct defaults = 5;
}

// ===================== EFFECTS =====================

message SpotlightEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float blurAmount = 6;
  float borderRadius = 7;
  float startFrame = 8;
  float endFrame = 9;
}

message CalloutEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float blurAmount = 6;
  float borderRadius = 7;
  float startFrame = 8;
  float endFrame = 9;
  string color = 10;
}

message ZoomEffect {
  string id = 1;
  float x = 2;
  float y = 3;
  float zoomLevel = 4;
  float startFrame = 5;
  float endFrame = 6;
}

// ===================== BACKWARD COMPAT TYPES =====================

enum EffectType {
  EFFECT_TYPE_UNDEFINED = 0;
  EFFECT_TYPE_CALLOUT = 1;
  EFFECT_TYPE_SPOTLIGHT = 2;
  EFFECT_TYPE_ZOOM = 3;
}

// ===================== SLIDE =====================

message Slide {
  string id = 1;
  string transcript = 3;
  TransitionType transition = 5;
  optional int32 transitionDurationInFrames = 6;
  optional BackgroundStyle background_style = 7;
  optional TransitionDirection direction = 23;
  int32 durationInFrames = 25;
  int32 settledFrame = 26;
  AnimationSlideContent content = 9;
  optional bool voiceoverGenerated = 15;
  optional bool isNested = 16;
  repeated SpotlightEffect spotlights = 18;
  repeated CalloutEffect callouts = 19;
  repeated ZoomEffect zooms = 20;
  google.protobuf.Struct plan = 21;
  SlideStatus slideStatus = 22;
  int32 index = 24;
  string tid = 27; // Template ID
}

message BackgroundStyle {
  oneof style {
    SolidColor solid = 1;
    Gradient gradient = 2;
    BackgroundImage image = 3;
  }

  bool apply_all = 4;
  BackgroundPattern pattern = 5;
  optional float pattern_opacity = 6; // 0.0 to 1.0, defaults to 0.1
  optional BackgroundEffect effect = 7;
}

message BackgroundEffect {
  BackgroundEffectType type = 1;
}

message SolidColor {
  string hex = 1; // Example: "#0f172a"
}

message BackgroundImage {
  string url = 1; // CDN or storage URL
}

message Gradient {
  GradientType type = 1;
  int32 angle = 2; // 0–360 degrees

  repeated GradientStop stops = 3;
}

message GradientStop {
  string color = 1;   // "#ffffff"
  int32 position = 2; // 0–100 (%)
}

enum GradientType {
  GRADIENT_TYPE_LINEAR = 0;
  GRADIENT_TYPE_RADIAL = 1;
}

enum BackgroundPattern {
  BACKGROUND_PATTERN_NONE = 0;
  BACKGROUND_PATTERN_DOTS = 1;
  BACKGROUND_PATTERN_GRID = 2;
  BACKGROUND_PATTERN_DIAGONAL_LINES = 3;
  BACKGROUND_PATTERN_CROSS_HATCH = 4;
  BACKGROUND_PATTERN_CIRCLES = 5;
  BACKGROUND_PATTERN_HEXAGONS = 6;
  BACKGROUND_PATTERN_TRIANGLES = 7;
  BACKGROUND_PATTERN_WAVES = 8;
}

enum BackgroundEffectType {
  BACKGROUND_EFFECT_TYPE_NONE = 0;
  BACKGROUND_EFFECT_TYPE_AURORA = 1;
  BACKGROUND_EFFECT_TYPE_GLOW = 2;
  BACKGROUND_EFFECT_TYPE_SWEEP = 3;
}



// ===================== SECTION =====================

message Section {
  string id = 1;
  string title = 2;
  string color = 3;
  repeated Slide slides = 4;
  optional bool voiceoverGenerated = 5;
  int32 index = 6;
}
