syntax = "proto3";

package coasterai.core.v1;
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/shank318/coasterai/pb/coasterai/core/v1;pbcore";

message CreditLedgerEntry {
  string id = 1;
  .google.protobuf.Timestamp created_at = 2;
  int32 amount = 3;
  string action = 4;
}

message GetCreditsRequest {
  optional string referenceID = 1;
  bool ledger = 2;
}

message GetCreditsResponse {
  int32 available = 1;
  repeated CreditLedgerEntry entries = 2;
}